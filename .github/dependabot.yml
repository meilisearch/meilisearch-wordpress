# Workflow actions are pinned to full commit SHAs (with the release in a trailing comment), so a moved
# tag cannot change what the release job runs. Dependabot keeps the SHA and the comment up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The integration suites test the WooCommerce version in composer.lock: keep it on the current release.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: wpackagist-plugin/woocommerce
