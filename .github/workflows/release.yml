name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Version guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tag, Version header, MEILISEARCH_VERSION and Stable tag must match
        run: bash bin/check-version.sh "$GITHUB_REF_NAME"

  tests:
    name: Tests
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    name: Deploy to wordpress.org and GitHub
    needs: [version, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2, wp-cli

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build the distributable
        run: bash bin/build-zip.sh

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Deploy to the wordpress.org plugin directory
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: meilisearch
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: build/meilisearch
          ASSETS_DIR: .wordpress-org

      - name: Name the release zip
        run: cp build/meilisearch.zip "build/meilisearch-${{ steps.version.outputs.version }}.zip"

      - name: GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: build/meilisearch-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
