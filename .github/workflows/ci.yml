name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: PHPCS + PHPStan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPCS (WordPress Coding Standards)
        run: composer lint

      - name: PHPStan
        run: composer analyse

  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install a comma-decimal locale (FilterBuilderTest::test_float_formatting_ignores_locale)
        run: sudo locale-gen de_DE.UTF-8

      - name: Unit tests
        run: composer test:unit

  integration:
    name: Integration (WP ${{ matrix.wp }}, Meilisearch ${{ matrix.meili }}, ${{ matrix.suite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        wp: ['6.9', 'latest']
        meili: ['v1.34', 'latest']
        suite: ['core']
        include:
          - wp: latest
            meili: latest
            suite: woocommerce
          - wp: latest
            meili: latest
            suite: multisite
          - wp: latest
            meili: latest
            suite: multisite-woocommerce
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      meilisearch:
        image: getmeili/meilisearch:${{ matrix.meili }}
        env:
          MEILI_MASTER_KEY: masterKey
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
        options: >-
          --health-cmd="curl -fsS http://localhost:7700/health"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MEILISEARCH_TEST_WC: ${{ endsWith(matrix.suite, 'woocommerce') && '1' || '' }}
      WP_MULTISITE: ${{ startsWith(matrix.suite, 'multisite') && '1' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Select WordPress ${{ matrix.wp }}
        env:
          WP_VERSION: ${{ matrix.wp }}
        run: |
          if [ "$WP_VERSION" = "latest" ]; then constraint='*'; else constraint="${WP_VERSION}.*"; fi
          composer require --dev --no-interaction --no-progress --update-with-dependencies \
            "roots/wordpress-no-content:${constraint}" "wp-phpunit/wp-phpunit:${constraint}"
          composer show roots/wordpress-no-content | grep -E '^versions'

      - name: Install WooCommerce for the integration suite
        if: endsWith(matrix.suite, 'woocommerce')
        run: |
          if [ ! -d tests/integration/plugins/woocommerce ]; then
            mkdir -p tests/integration/plugins
            curl -fsSL -o "$RUNNER_TEMP/woocommerce.zip" https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip
            unzip -q "$RUNNER_TEMP/woocommerce.zip" -d tests/integration/plugins
          fi

      - name: Integration tests
        run: composer test:integration

      - name: WP-CLI command registration (plugin booted under the WP-CLI shim)
        if: matrix.suite == 'core'
        env:
          MEILISEARCH_TEST_WP_CLI: '1'
        run: composer test:integration -- --filter BootTest

  e2e:
    name: E2E (latest WordPress, WooCommerce and Meilisearch)
    runs-on: ubuntu-24.04
    env:
      MEILI_VERSION: latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and start WordPress, MySQL and Meilisearch
        run: docker compose up -d --build --wait db meilisearch wordpress

      - name: Install and configure the E2E site
        run: bash bin/e2e-setup.sh

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Service logs
        if: failure()
        run: |
          docker compose logs --no-color wordpress meilisearch
          docker compose exec -T wordpress cat /var/www/html/wp-content/debug.log || true

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
